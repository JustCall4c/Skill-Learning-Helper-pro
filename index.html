                                            {item.isHard && <div className="absolute -top-3 -right-3 w-8 h-8 rounded-full flex items-center justify-center text-white shadow-md z-20 animate-bounce" style={{backgroundColor: '#f43f5e'}}><Icons.Flame size={16}/></div>}
                                            
                                            <div className="flex justify-between items-start mb-3">
                                                <div className="flex items-center gap-2 pr-8 pl-0">
                                                    <h3 className="font-bold text-lg truncate" style={{color: darkMode?'#fff':'#1e293b'}}>
                                                        <HighlightText text={item.title} highlight={searchQuery} />
                                                    </h3>
                                                </div>
                                                <div className="flex gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity absolute top-4 right-4 p-1 rounded-lg shadow-sm backdrop-blur-sm z-10" style={{backgroundColor: darkMode?'rgba(30,41,59,0.9)':'rgba(255,255,255,0.9)'}}>
                                                    {/* 1. 修复：置顶按钮 */}
                                                    <button onClick={(e)=>{e.stopPropagation();setShortcuts(s=>s.map(i=>i.id===item.id?{...i, isPinned:!i.isPinned}:i)); showToast(item.isPinned?'已取消置顶':'已置顶')}} className={`p-1.5 rounded-lg hover:bg-slate-100 transition-colors ${item.isPinned ? 'text-rose-500' : (darkMode?'text-slate-400':'text-slate-500')}`} title={item.isPinned?'取消置顶':'置顶'}>
                                                        {item.isPinned ? <Icons.PinOff size={14}/> : <Icons.Pin size={14}/>}
                                                    </button>
                                                    <button onClick={(e)=>{e.stopPropagation();openEdit(item)}} className="p-1.5 rounded-lg hover:bg-slate-100 transition-colors" style={{color: darkMode?'#94a3b8':'#64748b'}} onMouseEnter={e=>e.currentTarget.style.color = 'var(--accent-color)'} onMouseLeave={e=>e.currentTarget.style.color = darkMode?'#94a3b8':'#64748b'}><Icons.Edit size={14}/></button>
                                                    <button onClick={(e)=>{e.stopPropagation();setDeleteId(item.id);setModalType('delete')}} className="p-1.5 rounded-lg hover:bg-slate-100 transition-colors" style={{color: darkMode?'#94a3b8':'#64748b'}} onMouseEnter={e=>e.currentTarget.style.color = '#ef4444'} onMouseLeave={e=>e.currentTarget.style.color = darkMode?'#94a3b8':'#64748b'}><Icons.Trash size={14}/></button>
                                                </div>
                                            </div>
                                            
                                            {/* 4. 新增：固定高度的内容区域 - 改为 flex 自适应 */}
                                            <div className={`card-content-fixed ${isQuizMode ? 'blur-content' : ''}`}>
                                                {item.type === 'keys' ? (
                                                    <div className="flex flex-wrap gap-1.5">
                                                        {item.code.split(/ \+ /).map((k,i) => {
                                                            let displayKey = k.trim();
                                                            const upperKey = displayKey.toUpperCase();
                                                            if(upperKey === 'UP' || upperKey === 'ARROWUP' || upperKey === '↑') displayKey = '↑';
                                                            else if(upperKey === 'DOWN' || upperKey === 'ARROWDOWN' || upperKey === '↓') displayKey = '↓';
                                                            else if(upperKey === 'LEFT' || upperKey === 'ARROWLEFT' || upperKey === '←') displayKey = '←';
                                                            else if(upperKey === 'RIGHT' || upperKey === 'ARROWRIGHT' || upperKey === '→') displayKey = '→';
                                                            else if(upperKey === 'PLUS') displayKey = '+'; 
                                                            
                                                            return <span key={i} className="px-2.5 py-1 rounded-lg text-xs font-bold border-b-2" style={{backgroundColor: darkMode?'#334155':'#f1f5f9', borderColor: darkMode?'#475569':'#e2e8f0', color: darkMode?'#e2e8f0':'#334155'}}>
                                                                <HighlightText text={displayKey} highlight={searchQuery} />
                                                            </span>
                                                        })}
                                                    </div>
                                                ) : item.type === 'steps' ? (
                                                    <div className="flex flex-wrap items-center gap-1.5 text-xs mb-2" style={{color: darkMode?'#94a3b8':'#64748b'}}>
                                                        {item.code.split(/[\n>＞]+/).map((s,i,a)=><React.Fragment key={i}><span className="px-2 py-1 rounded border" style={{backgroundColor: darkMode?'#334155':'#f8fafc', borderColor: darkMode?'#475569':'#e2e8f0'}}>
                                                            <HighlightText text={s.trim()} highlight={searchQuery} />
                                                        </span>{i<a.length-1 && <Icons.Right size={12}/>}</React.Fragment>)}
                                                    </div>
                                                ) : item.type === 'note' ? (
                                                    // 6. 修复：新增笔记类型展示
                                                    <div className="text-sm leading-relaxed whitespace-pre-wrap" style={{color: darkMode?'#cbd5e1':'#475569'}}>
                                                        <HighlightText text={item.code} highlight={searchQuery} />
                                                    </div>
                                                ) : (
                                                    // 4. 修复：代码块支持换行 (whitespace-pre-wrap)
                                                    <div className="p-3 rounded-xl border relative group/code" style={{backgroundColor: darkMode?'#0f172a':'#f8fafc', borderColor: darkMode?'#334155':'#f1f5f9'}}>
                                                        <code className="text-sm font-mono break-all whitespace-pre-wrap" style={{color: darkMode?'#60a5fa':'#2563eb'}}>
                                                            <HighlightText text={item.code} highlight={searchQuery} />
                                                        </code>
                                                        <button onClick={(e)=>{e.stopPropagation(); handleCopy(item.code, item.id)}} className="absolute top-2 right-2 text-slate-400 hover:text-emerald-500 opacity-0 group-hover/code:opacity-100 transition-opacity"><Icons.Copy size={14}/></button>
                                                    </div>
                                                )}
                                                
                                                {/* 4. 修复：独立解释区 */}
                                                {item.explanation && (
                                                    <div className="mt-3 pt-3 border-t text-xs leading-relaxed opacity-80" style={{borderColor: darkMode?'#334155':'#e2e8f0', color: darkMode?'#94a3b8':'#64748b'}}>
                                                        <div className="font-bold mb-1 opacity-60">💡 详解：</div>
                                                        <div className="whitespace-pre-wrap">
                                                            <HighlightText text={item.explanation} highlight={searchQuery} />
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* 5. 修复：标签展示区 (增加 mt-3 和边框) */}
                                            {item.tags && item.tags.length > 0 && (
                                                <div className="flex flex-wrap gap-1 mb-3 mt-3 pt-2 border-t border-dashed max-h-[46px] overflow-y-auto custom-scrollbar" style={{borderColor: darkMode?'#334155':'#ffe4e6'}}>
                                                    {item.tags.map(tag => (
                                                        <span key={tag} className="text-[10px] px-1.5 py-0.5 rounded-md border opacity-60" style={{borderColor: darkMode?'#334155':'#e2e8f0', color: darkMode?'#94a3b8':'#64748b'}}>
                                                            #<HighlightText text={tag} highlight={searchQuery} />
                                                        </span>
                                                    ))}
                                                </div>
                                            )}

                                            <div className="flex justify-between items-center pt-3 border-t mt-auto" style={{borderColor: darkMode?'#334155':'#f1f5f9'}}>
                                                <div className={`flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-bold border`} style={{borderColor: tConf.color, color: tConf.color, backgroundColor: darkMode ? tConf.darkBg : tConf.bg}}><tConf.icon size={12}/> {tConf.label}</div>
                                                {item.note && <span className="text-xs max-w-[220px] truncate text-right" style={{color: darkMode?'#94a3b8':'#94a3b8'}} title={item.note}>
                                                    <HighlightText text={item.note} highlight={searchQuery} />
                                                </span>}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        )}
                    </main>

                    {/* Timer Modal */}
                    <Modal isOpen={modalType === 'timer'} onClose={() => setModalType(null)} title="🍅 番茄专注" darkMode={darkMode}>
                        <div className="text-center py-4">
                            <p className="mb-6 opacity-60" style={{color: darkMode ? '#fff' : '#1e293b'}}>选择一个专注时长，开始学习吧！</p>
                            <div className="flex justify-center p-1 rounded-full bg-slate-100 dark:bg-slate-800 mx-auto w-fit">
                                {TIMER_OPTIONS.map((m, idx) => (
                                    <button key={m} onClick={() => startTimer(m)} className={`px-6 py-2 rounded-full font-bold text-sm transition-all duration-300 relative z-10 ${idx === timerSelection ? 'shadow-md scale-105' : 'hover:opacity-80'}`}
                                        style={{
                                            backgroundColor: idx === timerSelection ? (darkMode ? '#334155' : 'white') : 'transparent',
                                            color: idx === timerSelection ? 'var(--accent-color)' : (darkMode ? '#94a3b8' : '#64748b')
                                        }}>
                                        {m} min
                                    </button>
                                ))}
                            </div>
                             <div className="text-[10px] text-center mt-6 opacity-50">← →选择 Enter开始</div>
                        </div>
                    </Modal>

                    {/* Manage Categories Modal */}
                    <Modal isOpen={modalType === 'addCategory'} onClose={() => {setModalType(null); setDeleteConfirmName('');}} title="管理类别" darkMode={darkMode}>
                        <div className="space-y-4">
                            <div className="space-y-2 mb-4 max-h-60 overflow-y-auto pr-1">
                                {categories.map((c, idx) => {
                                    return (
                                        <div key={c.id} draggable onDragStart={() => dragCategoryItem.current = idx} onDragEnter={() => dragCategoryOverItem.current = idx} onDragEnd={handleDragCategorySort} onDragOver={(e) => e.preventDefault()}
                                            onClick={(e) => e.stopPropagation()} 
                                            className="flex flex-col p-2 rounded-lg border cursor-move group transition-all" style={{borderColor: (darkMode?'#334155':'#f1f5f9'), backgroundColor: 'transparent'}}>
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-3 flex-1">
                                                    <div className="relative">
                                                        <button type="button" onClick={() => setShowIconPicker(showIconPicker === c.id ? null : c.id)} className="p-1 rounded hover:bg-black/5">
                                                            {(() => { const I = getIconComp(c.icon); return <I size={16} className="text-slate-400"/>; })()}
                                                        </button>
                                                        {showIconPicker === c.id && (
                                                            <div className="absolute left-0 top-full mt-1 bg-white border shadow-xl rounded-lg p-2 z-50 flex gap-1 flex-wrap w-32" style={{backgroundColor: darkMode ? '#1e293b' : 'white'}}>
                                                                {AVAILABLE_ICONS.map(iName => {
                                                                    const I = Icons[iName];
                                                                    return <button type="button" key={iName} onClick={() => { setCategories(categories.map(cat => cat.id === c.id ? {...cat, icon: iName} : cat)); setShowIconPicker(null); }} className="p-1 hover:bg-slate-100 rounded text-slate-500"><I size={14}/></button>
                                                                })}
                                                            </div>
                                                        )}
                                                        {showIconPicker === c.id && <div className="fixed inset-0 z-40" onClick={() => setShowIconPicker(null)}></div>}
                                                    </div>
                                                    {editingCategoryId === c.id ? (
                                                        <input autoFocus defaultValue={c.label} onBlur={(e)=>handleEditCategory(c.id, e.target.value)} onKeyDown={(e)=>e.key==='Enter'&&handleEditCategory(c.id, e.currentTarget.value)} className="bg-transparent outline-none w-full" style={{color: darkMode?'#fff':'#333'}} />
                                                    ) : (
                                                        <span style={{color: darkMode?'#cbd5e1':'#475569'}}>{c.label}</span>
                                                    )}
                                                </div>
                                                <div className="flex gap-2 opacity-50 group-hover:opacity-100">
                                                    <button onClick={()=>setEditingCategoryId(c.id)} className="text-blue-400 hover:text-blue-500"><Icons.Edit size={14}/></button>
                                                    <button 
                                                        onClick={() => startCategoryDelete(c.id)} 
                                                        className={`transition-colors text-rose-300 hover:text-rose-500`}
                                                    >
                                                        <Icons.Trash size={14}/>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                            <form onSubmit={(e) => { e.preventDefault(); handleAddCategory(); }} className="pt-4 border-t" style={{borderColor: darkMode?'#334155':'#f1f5f9'}}>
                                <div className="flex gap-2 mb-3">
                                    <div className="relative">
                                         <button type="button" onClick={() => setShowIconPicker('new')} className="w-10 h-10 border rounded-lg flex items-center justify-center cursor-pointer" style={{borderColor: darkMode?'#334155':'#e2e8f0'}}>
                                              {(() => { const I = getIconComp(newCategoryIcon); return <I size={18} style={{color: 'var(--accent-color)'}}/> })()}
                                         </button>
                                         {showIconPicker === 'new' && (
                                              <div className="absolute left-0 bottom-full mb-1 bg-white border shadow-xl rounded-lg p-2 z-50 flex gap-1 flex-wrap w-32" style={{backgroundColor: darkMode ? '#1e293b' : 'white'}}>
                                                  {AVAILABLE_ICONS.map(iName => {
                                                      const I = Icons[iName];
                                                      return <button type="button" key={iName} onClick={() => { setNewCategoryIcon(iName); setShowIconPicker(null); }} className="p-1 hover:bg-slate-100 rounded text-slate-500"><I size={14}/></button>
                                                  })}
                                              </div>
                                         )}
                                         {showIconPicker === 'new' && <div className="fixed inset-0 z-40" onClick={() => setShowIconPicker(null)}></div>}
                                    </div>
                                    <input autoFocus value={newCategoryName} onChange={e=>setNewCategoryName(e.target.value)} placeholder="输入新类别名称" className="flex-1 border-none rounded-xl px-4 text-sm font-bold focus:ring-2" style={{backgroundColor: darkMode ? '#0f172a' : '#f8fafc', color: darkMode ? '#f1f5f9' : '#334155'}} />
                                </div>
                                <button type="submit" className="w-full py-3 rounded-xl font-bold shadow-lg hover:scale-[1.02] transition-transform" style={{backgroundColor: darkMode ? 'var(--accent-color)' : '#0f172a', color: '#ffffff'}}>添加</button>
                            </form>
                        </div>
                    </Modal>
                    
                    {/* Delete Category Verification Steps */}
                    <Modal isOpen={modalType === 'verifyDeleteCategory'} onClose={() => setModalType('addCategory')} title="🛡️ 安全验证" darkMode={darkMode} maxWidth="max-w-sm">
                        <div className="space-y-4">
                            {(() => {
                                const cat = categories.find(c => c.id === categoryToDelete);
                                if (!cat) return null;
                                return (
                                    <>
                                        <p className="text-sm opacity-80" style={{color: darkMode ? '#94a3b8' : '#64748b'}}>
                                            为了防止误删，请输入 <span className="font-bold select-all" style={{color: darkMode?'#fff':'#333'}}>"{cat.label}确认删除"</span>
                                        </p>
                                        <input 
                                            autoFocus
                                            placeholder={`请输入...`}
                                            value={deleteConfirmName}
                                            onChange={(e) => setDeleteConfirmName(e.target.value)}
                                            className="w-full px-4 py-3 rounded-xl border outline-none text-sm font-bold shadow-sm"
                                            style={{
                                                backgroundColor: darkMode?'rgba(0,0,0,0.2)':'rgba(255,255,255,0.5)', 
                                                borderColor: deleteConfirmName === cat.label + '确认删除' ? 'var(--accent-color)' : (darkMode?'#334155':'#e2e8f0'), 
                                                color: darkMode?'#fff':'#333'
                                            }}
                                        />
                                        <div className="flex gap-3 pt-2">
                                            <button onClick={() => setModalType('addCategory')} className="flex-1 py-3 rounded-xl font-bold transition-colors" style={{backgroundColor: darkMode ? '#334155' : '#f1f5f9', color: darkMode ? '#fff' : '#475569'}}>取消</button>
                                            <button 
                                                onClick={confirmVerification}
                                                disabled={deleteConfirmName !== cat.label + '确认删除'}
                                                className={`flex-1 py-3 rounded-xl font-bold shadow-lg transition-all ${deleteConfirmName === cat.label + '确认删除' ? 'bg-rose-500 hover:bg-rose-600 text-white transform hover:scale-105' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                                            >
                                                验证并继续
                                            </button>
                                        </div>
                                    </>
                                );
                            })()}
                        </div>
                    </Modal>

                    <Modal isOpen={modalType === 'confirmDeleteCategory'} onClose={() => setModalType('addCategory')} title="🚨 最终确认" darkMode={darkMode} maxWidth="max-w-sm">
                        <div className="text-center">
                            <div className="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                                <Icons.Trash size={32} />
                            </div>
                            <h3 className="font-bold text-lg mb-2" style={{color: darkMode ? '#fff' : '#1e293b'}}>真的要删除吗？</h3>
                            <p className="mb-6 text-sm" style={{color: darkMode ? '#94a3b8' : '#64748b'}}>该类别下的所有笔记也将被<br/><b>永久移除</b>且无法恢复。</p>
                            <div className="flex gap-3">
                                <button onClick={() => setModalType('addCategory')} className="flex-1 py-3 rounded-xl font-bold" style={{backgroundColor: darkMode ? '#334155' : '#f1f5f9', color: darkMode ? '#fff' : '#475569'}}>取消</button>
                                <button onClick={handleFinalDeleteCategory} className="flex-1 py-3 bg-rose-500 text-white rounded-xl font-bold shadow-lg hover:bg-rose-600">确认删除</button>
                            </div>
                        </div>
                    </Modal>

                    {/* Import Conflict Modal (New Feature) */}
                    <Modal isOpen={modalType === 'importConflict'} onClose={() => setModalType(null)} title="⚠️ 发现新增笔记" darkMode={darkMode} maxWidth="max-w-sm">
                        <div className="text-center">
                            <div className="w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                                <Icons.Alert size={32} />
                            </div>
                            <h3 className="font-bold text-lg mb-2" style={{color: darkMode ? '#fff' : '#1e293b'}}>是否保留当前新增的笔记？</h3>
                            <p className="mb-6 text-sm" style={{color: darkMode ? '#94a3b8' : '#64748b'}}>
                                检测到有 <b>{importPendingData?.localUnique?.length || 0}</b> 条笔记存在于当前设备，<br/>
                                但不在备份文件中。
                            </p>
                            <div className="flex flex-col gap-3">
                                <button onClick={() => handleConfirmImport(true)} className="w-full py-3 rounded-xl font-bold text-white shadow-lg transition-transform hover:scale-[1.02]" style={{backgroundColor: 'var(--accent-color)'}}>
                                    ✨ 保留 (合并数据)
                                </button>
                                <button onClick={() => handleConfirmImport(false)} className="w-full py-3 rounded-xl font-bold border hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" style={{borderColor: darkMode?'#334155':'#e2e8f0', color: darkMode?'#94a3b8':'#64748b'}}>
                                    仅恢复备份 (覆盖)
                                </button>
                            </div>
                        </div>
                    </Modal>

                    {/* Add/Edit Modal */}
                    <Modal isOpen={modalType === 'add'} onClose={safeCloseAddModal} title={editingItem ? '✏️ 修改笔记' : '✨ 新增笔记'} darkMode={darkMode} maxWidth="max-w-lg">
                        <form className="space-y-4" onKeyDown={(e) => { 
                            if((e.ctrlKey || e.metaKey) && e.key === 's') {
                                handleSave(e); 
                            }
                        }}>
                             {/* 3. 修复：UI 对齐与高度统一 */}
                             <div className="grid grid-cols-2 gap-4 mb-4"> {/* Increased gap and explicit margin bottom */}
                                <div className="flex flex-col">
                                    <label className="text-xs font-bold mb-2 block uppercase" style={{color: darkMode ? '#94a3b8' : '#cbd5e1'}}>类别</label>
                                    <div className="flex flex-col gap-2 max-h-[170px] overflow-y-auto custom-scrollbar pr-1">
                                        {categories.map(c => (
                                            <div key={c.id} onClick={() => setNewEntry({...newEntry, category: c.id})} className={`px-3 py-2 rounded-lg text-xs font-bold border cursor-pointer flex justify-between transition-colors`} style={{borderColor: newEntry.category === c.id ? 'var(--accent-color)' : (darkMode ? '#334155' : '#e2e8f0'), backgroundColor: newEntry.category === c.id ? 'var(--bg-color)' : 'transparent', color: newEntry.category === c.id ? 'var(--accent-color)' : (darkMode ? '#94a3b8' : '#64748b')}}>{c.label} {newEntry.category===c.id&&<Icons.Check size={14}/>}</div>
                                        ))}
                                    </div>
                                </div>
                                <div className="flex flex-col">
                                    <label className="text-xs font-bold mb-2 block uppercase" style={{color: darkMode ? '#94a3b8' : '#cbd5e1'}}>类型 (↑ ↓)</label>
                                    <div className="flex flex-col gap-2"> {/* No max height for types as there are few */}
                                        {Object.entries(types).map(([k, t], idx) => (
                                            <button 
                                                type="button"
                                                key={k} 
                                                ref={el => typeBtnRefs.current[idx] = el}
                                                onClick={() => setNewEntry({...newEntry, type: k})} 
                                                onKeyDown={(e) => handleTypeKeyDown(e, idx)}
                                                className={`px-3 py-2 rounded-lg text-xs font-bold border cursor-pointer flex items-center gap-2 transition-colors w-full text-left focus:ring-2 focus:ring-offset-1 focus:outline-none`} 
                                                style={{
                                                    borderColor: newEntry.type === k ? t.color : (darkMode ? '#334155' : '#e2e8f0'), 
                                                    backgroundColor: newEntry.type === k ? (darkMode ? t.darkBg : t.bg) : 'transparent', 
                                                    color: newEntry.type === k ? t.color : (darkMode ? '#94a3b8' : '#64748b')
                                                }}
                                            >
                                                <t.icon size={14}/> {t.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                             </div>
                             
                             <div className="flex gap-4 items-center">
                                 <input ref={titleRef} value={newEntry.title} onChange={e=>setNewEntry({...newEntry, title:e.target.value})} placeholder="标题" className="flex-1 border-none rounded-xl px-4 py-3 text-sm font-bold focus:ring-2" style={{backgroundColor: darkMode ? '#0f172a' : '#f8fafc', color: darkMode ? '#f1f5f9' : '#334155'}} 
                                    onKeyDown={(e) => { 
                                        if(e.key === 'ArrowUp') { 
                                            e.preventDefault(); 
                                            const currentTypeIdx = Object.keys(types).indexOf(newEntry.type);
                                            if (typeBtnRefs.current[currentTypeIdx]) typeBtnRefs.current[currentTypeIdx].focus();
                                        } 
                                        if(e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); codeRef.current?.focus(); }
                                        // 1. 修复：当光标在末尾时，按右键跳转到"难点"
                                        if(e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) { 
                                            e.preventDefault(); 
                                            hardBtnRef.current?.focus(); 
                                        } 
                                   }} />
                                 {/* 5. 修复：Hard 标记开关 改名为 难点 */}
                                 <button type="button" ref={hardBtnRef} onClick={() => setNewEntry(p => ({...p, isHard: !p.isHard}))} 
                                    onKeyDown={(e) => {
                                        if(e.key === 'Enter') { 
                                            e.preventDefault(); // 阻止默认点击，防止触发两次
                                            setNewEntry(p => ({...p, isHard: !p.isHard})); // 只切换状态，不跳转
                                        }
                                        if(e.key === 'ArrowDown') { // 下箭头 -> 核心内容
                                            e.preventDefault();
                                            codeRef.current?.focus();
                                        }
                                        if(e.key === 'ArrowLeft') { e.preventDefault(); titleRef.current?.focus(); } // Hard -> Title
                                        if(e.key === 'ArrowRight') { e.preventDefault(); pinBtnRef.current?.focus(); } // Hard -> Pin
                                    }}
                                    className={`px-3 py-2 rounded-xl text-xs font-bold transition-all border outline-none focus:ring-2 ${newEntry.isHard ? 'bg-rose-50 border-rose-500 text-rose-600 dark:bg-rose-900/30 dark:text-rose-400' : 'border-transparent text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                                      🔥 难点
                                 </button>
                                 {/* 1. 修复：置顶开关 */}
                                 <button type="button" ref={pinBtnRef} onClick={() => setNewEntry(p => ({...p, isPinned: !p.isPinned}))} 
                                    onKeyDown={(e) => {
                                        if(e.key === 'Enter') { 
                                            e.preventDefault(); 
                                            setNewEntry(p => ({...p, isPinned: !p.isPinned})); 
                                        }
                                        // Pin -> Hard (Left)
                                        if(e.key === 'ArrowLeft') { e.preventDefault(); hardBtnRef.current?.focus(); }
                                        // Pin -> Core (Down)
                                        if(e.key === 'ArrowDown') { e.preventDefault(); codeRef.current?.focus(); } 
                                    }}
                                    className={`px-3 py-2 rounded-xl text-xs font-bold transition-all border outline-none focus:ring-2 ${newEntry.isPinned ? 'bg-indigo-50 border-indigo-500 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400' : 'border-transparent text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                                      📌 置顶
                                 </button>
                             </div>
                             
                             {/* 内容输入框 */}
                             <div className="relative">
                                <label className="text-xs font-bold mb-1 block opacity-60" style={{color: darkMode ? '#94a3b8' : '#cbd5e1'}}>
                                    {newEntry.type === 'note' ? '📝 笔记内容' : (newEntry.type === 'code' ? '💻 代码输入' : '⌨️ 输入区域')}
                                </label>
                                <textarea ref={codeRef} rows="3" value={newEntry.code} onChange={e=>setNewEntry({...newEntry, code:e.target.value})} placeholder={newEntry.type==='steps' ? '按Enter自动插入箭头 > ' : (newEntry.type==='keys'?'按键组合...':'输入内容...')} 
                                    className="w-full border-none rounded-xl px-4 py-3 text-sm font-mono focus:ring-2" style={{backgroundColor: darkMode ? '#0f172a' : '#f8fafc', color: darkMode ? '#f1f5f9' : '#334155'}} 
                                    onKeyDown={(e) => { 
                                        if ((e.ctrlKey || e.metaKey) && e.key === 's') return;

                                        if(newEntry.type === 'keys') { 
                                            const isModifierHeld = e.ctrlKey || e.shiftKey || e.altKey || e.metaKey;
                                            const isNavKey = ['ArrowUp', 'ArrowDown', 'Enter', 'Tab'].includes(e.key);

                                            if (!isModifierHeld && isNavKey) {
                                                if (e.key === 'ArrowUp') { e.preventDefault(); titleRef.current?.focus(); }
                                                if (e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); noteRef.current?.focus(); }
                                                return;
                                            }

                                            e.preventDefault(); 
                                            const k=[]; 
                                            if(e.ctrlKey)k.push('Ctrl');
                                            if(e.shiftKey)k.push('Shift');
                                            if(e.altKey)k.push('Alt'); 
                                            if(e.metaKey)k.push('Cmd');
                                            
                                            if(!['Control','Shift','Alt','Meta'].includes(e.key)) {
                                                let keyName = e.key.toUpperCase();
                                                if (e.key === 'ArrowUp') keyName = '↑';
                                                else if (e.key === 'ArrowDown') keyName = '↓';
                                                else if (e.key === 'ArrowLeft') keyName = '←';
                                                else if (e.key === 'ArrowRight') keyName = '→';
                                                else if (e.key === '+') keyName = 'Plus'; 
                                                
                                                k.push(keyName);
                                            }
                                            
                                            if(k.length) setNewEntry({...newEntry, code: k.join(' + ')}); 
                                            
                                    } else if (newEntry.type === 'steps') {
                                            if (e.key === 'Enter' && !e.shiftKey) {
                                                e.preventDefault();
                                                const val = newEntry.code;
                                                const hasTrailingArrow = val.trim().endsWith('>');
                                                
                                                if (hasTrailingArrow) {
                                                     let newVal = val.trim();
                                                     if (newVal.endsWith('>')) newVal = newVal.slice(0, -1).trim();
                                                     setNewEntry({...newEntry, code: newVal});
                                                     noteRef.current?.focus();
                                                } else {
                                                    const start = e.target.selectionStart;
                                                    const end = e.target.selectionEnd;
                                                    const newVal = val.substring(0, start) + " > " + val.substring(end);
                                                    setNewEntry({...newEntry, code: newVal});
                                                    setTimeout(() => {
                                                        e.target.selectionStart = e.target.selectionEnd = start + 3;
                                                    }, 0);
                                                }
                                            }
                                            else if(e.key === 'ArrowUp') { e.preventDefault(); titleRef.current?.focus(); } 
                                            else if(e.key === 'ArrowDown') { e.preventDefault(); noteRef.current?.focus(); }
                                    } else { 
                                            // 4. 修复：允许普通代码块换行，不拦截 Enter
                                            if(e.key === 'ArrowUp') { e.preventDefault(); titleRef.current?.focus(); } 
                                            // 修复：当光标在最后一行时，允许向下跳转
                                            if(e.key === 'ArrowDown' && !e.shiftKey) {
                                                // 获取当前光标位置是否在最后
                                                if (e.target.selectionStart === e.target.value.length) {
                                                    e.preventDefault();
                                                    noteRef.current?.focus();
                                                }
                                            }
                                    } 
                                   }} 
                                />
                             </div>

                             {/* 备注输入框 */}
                             <input ref={noteRef} value={newEntry.note} onChange={e=>setNewEntry({...newEntry, note:e.target.value})} placeholder="备注（简短说明）" className="w-full border-none rounded-xl px-4 py-2 text-xs focus:ring-2" style={{backgroundColor: darkMode ? '#0f172a' : '#f8fafc', color: darkMode ? '#f1f5f9' : '#334155'}} 
                                onKeyDown={(e) => { 
                                    if(e.key === 'ArrowUp') { e.preventDefault(); codeRef.current?.focus(); } 
                                    if(e.key === 'ArrowDown') { e.preventDefault(); explanationRef.current?.focus(); } // Fix 3: ArrowDown to explanation
                                    if(e.key === 'Enter') { handleSave(e); }
                                }} />

                             {/* 4. 修复：详细解释输入框 */}
                             <div>
                                 <label className="text-xs font-bold mb-1 block opacity-60" style={{color: darkMode ? '#94a3b8' : '#cbd5e1'}}>💡 详细解释 (支持中文注释/原理分析)</label>
                                 <textarea ref={explanationRef} rows="3" value={newEntry.explanation} onChange={e=>setNewEntry({...newEntry, explanation:e.target.value})} placeholder="这里空间很大，可以写下详细的原理、易错点或中文注释..." 
                                    className="w-full border-none rounded-xl px-4 py-3 text-sm focus:ring-2" style={{backgroundColor: darkMode ? '#0f172a' : '#f8fafc', color: darkMode ? '#f1f5f9' : '#334155'}} 
                                    onKeyDown={(e) => { // Fix 3: Keyboard nav for explanation
                                        if(e.key === 'ArrowUp') { e.preventDefault(); noteRef.current?.focus(); }
                                        if(e.key === 'ArrowDown') { e.preventDefault(); tagsRef.current?.focus(); }
                                    }}
                                 />
                             </div>

                             {/* 5. 新增：标签输入 */}
                             <div>
                                 <label className="text-xs font-bold mb-1 block opacity-60" style={{color: darkMode ? '#94a3b8' : '#cbd5e1'}}>🏷️ 标签 (空格或逗号分隔)</label>
                                 <input ref={tagsRef} value={newEntry.tags} onChange={e=>setNewEntry({...newEntry, tags:e.target.value})} placeholder="例如: 面试 基础 易错" className="w-full border-none rounded-xl px-4 py-2 text-xs focus:ring-2" style={{backgroundColor: darkMode ? '#0f172a' : '#f8fafc', color: darkMode ? '#f1f5f9' : '#334155'}} 
                                    onKeyDown={(e) => { // Fix 3: Keyboard nav for tags
                                        if(e.key === 'ArrowUp') { e.preventDefault(); explanationRef.current?.focus(); }
                                        if(e.key === 'Enter') { handleSave(e); }
                                    }}
                                 />
                             </div>
                             
                             <button onClick={handleSave} className="w-full py-3 rounded-xl font-bold shadow-lg hover:scale-[1.02] transition-transform" style={{backgroundColor: darkMode ? 'var(--accent-color)' : '#0f172a', color: '#ffffff'}}>保存 (Ctrl+S)</button>
                        </form>
                    </Modal>

                    {/* Confirm Discard Modal (Bug Fix 4) */}
                    <Modal isOpen={modalType === 'confirmDiscard'} onClose={() => setModalType('add')} title="⚠️ 放弃修改？" darkMode={darkMode} maxWidth="max-w-xs">
                        <div className="text-center">
                            <p className="mb-6 text-sm" style={{color: darkMode ? '#94a3b8' : '#64748b'}}>当前内容尚未保存，确定要放弃吗？</p>
                            <div className="flex gap-3">
                                <button onClick={() => setModalType('add')} className="flex-1 py-2 rounded-xl font-bold text-sm" style={{backgroundColor: darkMode ? '#334155' : '#f1f5f9', color: darkMode ? '#fff' : '#475569'}}>继续编辑</button>
                                <button onClick={() => setModalType(null)} className="flex-1 py-2 bg-rose-500 text-white rounded-xl font-bold shadow-lg text-sm">放弃</button>
                            </div>
                        </div>
                    </Modal>

                    {/* Delete Confirm Modal */}
                    <Modal isOpen={modalType === 'delete'} onClose={() => setModalType(null)} title="确定删除？" darkMode={darkMode} maxWidth="max-w-xs">
                        <div className="text-center">
                            <p className="mb-6 text-sm" style={{color: darkMode ? '#94a3b8' : '#64748b'}}>这条笔记将被永久移除。</p>
                            <div className="flex gap-3">
                                <button onClick={() => setModalType(null)} className="flex-1 py-2 rounded-xl font-bold text-sm" style={{backgroundColor: darkMode ? '#334155' : '#f1f5f9', color: darkMode ? '#fff' : '#475569'}}>取消</button>
                                <button onClick={handleDelete} className="flex-1 py-2 bg-rose-500 text-white rounded-xl font-bold shadow-lg text-sm">删除</button>
                            </div>
                        </div>
                    </Modal>

                    {/* Import Modal */}
                    <Modal isOpen={modalType === 'import'} onClose={() => setModalType(null)} title="数据导入" darkMode={darkMode}>
                        <div className="space-y-4">
                            <div>
                                <label className="text-xs font-bold block mb-2" style={{color: darkMode ? '#94a3b8' : '#cbd5e1'}}>恢复数据</label>
                                <div className="flex gap-3">
                                    <button onClick={() => fileInputRef.current.click()} className="w-full py-2 rounded-lg text-sm font-bold transition-transform hover:scale-[1.02]" style={{backgroundColor: 'var(--accent-color)', color: '#ffffff'}}>选择备份文件 (.json)</button>
                                </div>
                                <p className="text-xs mt-2 opacity-60">提示：支持恢复分类、图标及专注时长 (新版有效)</p>
                            </div>
                        </div>
                    </Modal>
                    
                    {/* 2. 新增：Bug 记录 Modal */}
                    <Modal isOpen={modalType === 'bugList'} onClose={() => {setModalType(null); setEditingBugId(null); setTempBugText('');}} title="🐞 捉虫记" darkMode={darkMode}>
                         <div className="space-y-4">
                             <div className="flex gap-2">
                                 <input autoFocus value={newBug} onChange={e=>setNewBug(e.target.value)} placeholder="发现了什么 Bug..." className="flex-1 border-none rounded-xl px-4 py-2 text-sm bg-slate-100 dark:bg-slate-800 focus:ring-2 outline-none" 
                                    onKeyDown={e => e.key === 'Enter' && handleAddBug()}
                                 />
                                 <button onClick={handleAddBug} className="px-4 rounded-xl font-bold text-sm bg-slate-900 text-white dark:bg-white dark:text-slate-900">记录</button>
                             </div>
                             
                             <div className="max-h-60 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                                 {bugs.length === 0 ? (
                                     <div className="text-center py-8 text-xs opacity-40">暂无 Bug，系统运行良好！✨</div>
                                 ) : (
                                     bugs.map(bug => (
                                         <div key={bug.id} className="p-3 rounded-lg bg-slate-50 dark:bg-slate-800/50 flex justify-between items-start group">
                                             {editingBugId === bug.id ? (
                                                 <div className="flex-1 flex gap-2">
                                                     <input 
                                                         autoFocus
                                                         className="flex-1 bg-white dark:bg-slate-900 rounded px-2 py-1 text-sm border focus:ring-1 outline-none"
                                                         value={tempBugText}
                                                         onChange={(e) => setTempBugText(e.target.value)}
                                                         onKeyDown={(e) => {
                                                             if (e.key === 'Enter') saveEditBug();
                                                             if (e.key === 'Escape') { setEditingBugId(null); setTempBugText(''); }
                                                         }}
                                                     />
                                                     <button onClick={saveEditBug} className="text-emerald-500 hover:text-emerald-600"><Icons.Check size={16}/></button>
                                                     <button onClick={() => { setEditingBugId(null); setTempBugText(''); }} className="text-slate-400 hover:text-slate-500"><Icons.X size={16}/></button>
                                                 </div>
                                             ) : (
                                                 <>
                                                     <div className="flex-1 cursor-pointer" onDoubleClick={() => startEditBug(bug)}>
                                                         <div className="text-sm font-medium break-all">{bug.text}</div>
                                                         <div className="text-[10px] opacity-40 mt-1">{bug.date}</div>
                                                     </div>
                                                     <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                         <button onClick={() => startEditBug(bug)} className="text-slate-300 hover:text-blue-500"><Icons.Edit size={12}/></button>
                                                         <button onClick={() => handleDeleteBug(bug.id)} className="text-slate-300 hover:text-rose-500"><Icons.Trash size={12}/></button>
                                                     </div>
                                                 </>
                                             )}
                                         </div>
                                     ))
                                 )}
                             </div>
                             
                             <div className="text-xs opacity-60 pt-2 border-t dark:border-slate-700 flex justify-between items-center">
                                 <span>共 {bugs.length} 个待修复</span>
                                 {bugs.length > 0 && (
                                     <button onClick={() => setModalType('confirmClearBugs')} className="text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 px-2 py-1 rounded transition-colors flex items-center gap-1 font-bold">
                                         <Icons.Trash size={12}/> 一键清空
                                     </button>
                                 )}
                             </div>
                          </div>
                    </Modal>
                    
                    {/* Confirm Clear Bugs Modal - 更新后的确认弹窗 */}
                    <Modal isOpen={modalType === 'confirmClearBugs'} onClose={() => setModalType('bugList')} title="✨ 全部搞定？" darkMode={darkMode} maxWidth="max-w-xs">
                        <div className="text-center">
                            <div className="w-16 h-16 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                                <Icons.Check size={32} />
                            </div>
                            <h3 className="font-bold text-lg mb-2" style={{color: darkMode ? '#fff' : '#1e293b'}}>太棒了！</h3>
                            <p className="mb-6 text-sm" style={{color: darkMode ? '#94a3b8' : '#64748b'}}>
                                确认列表里的 Bug 都已经<br/>
                                <b>检查并修复</b> 完毕了吗？<br/>
                                <span className="text-xs opacity-80 mt-2 block">(清空后将重新开始记录)</span>
                            </p>
                            <div className="flex gap-3">
                                <button onClick={() => setModalType('bugList')} className="flex-1 py-3 rounded-xl font-bold transition-colors" style={{backgroundColor: darkMode ? '#334155' : '#f1f5f9', color: darkMode ? '#fff' : '#475569'}}>再检查下</button>
                                <button onClick={handleClearBugs} className="flex-1 py-3 bg-emerald-500 text-white rounded-xl font-bold shadow-lg hover:bg-emerald-600 transition-transform hover:scale-105">是的，清空！</button>
                            </div>
                        </div>
                    </Modal>

                    {/* 提醒弹窗 (每小时) */}
                    <Modal isOpen={modalType === 'reminder'} onClose={() => setModalType(null)} title="⏰ 休息一下吧！" darkMode={darkMode} showCloseBtn={false}>
                        <div className="text-center py-6 px-4">
                            <div className="w-24 h-24 bg-white rounded-full mx-auto mb-6 flex items-center justify-center pulse-border shadow-lg" style={{backgroundColor: darkMode ? '#334155' : 'white'}}>
                                <Icons.Coffee size={48} className="text-rose-400" />
                            </div>
                            <h3 className="text-xl font-bold mb-3" style={{color: darkMode ? '#fff' : '#1e293b'}}>已经过去一小时啦 ~</h3>
                            <p className="mb-8 opacity-80" style={{color: darkMode ? '#cbd5e1' : '#475569'}}>
                                起来活动一下，喝口水，眺望远方。<br/>
                                也不要忘记点一下“保存备份”哦！
                            </p>
                            <button onClick={() => setModalType(null)} className="px-8 py-3 rounded-full font-bold shadow-lg hover:scale-105 transition-transform" style={{backgroundColor: 'var(--accent-color)', color: 'white'}}>
                                我知道了 ({reminderCountdown}s)
                            </button>
                            <p className="mt-4 text-xs opacity-40">按 ESC 也可关闭</p>
                        </div>
                    </Modal>

                    <input 
                        type="file" 
                        ref={fileInputRef} 
                        style={{ display: 'none' }} 
                        onChange={handleImport} 
                        accept=".json" 
                    />

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
